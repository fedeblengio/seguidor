services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_URL=http://api.seguidor.unbrabyte.com
      - DB_CONNECTION=mysql
      - DB_HOST=eyqivqzoj9t2xccc4rdjmqp6
      - DB_PORT=3306
      - DB_DATABASE=seguidor
      - DB_USERNAME=seguidor
      - DB_PASSWORD=seguidor_2026!
      - REDIS_HOST=fhg1lsrwdvhegiz5q08gkih8
      - REDIS_PASSWORD=redis_seguidor_2026!
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - SANCTUM_STATEFUL_DOMAINS=seguidor.unbrabyte.com
      - SESSION_DOMAIN=.unbrabyte.com
      - CORS_ALLOWED_ORIGINS=http://seguidor.unbrabyte.com
    labels:
      - traefik.enable=true
      - traefik.http.routers.seguidor-api.rule=Host(`api.seguidor.unbrabyte.com`)
      - traefik.http.routers.seguidor-api.entryPoints=http
      - traefik.http.routers.seguidor-api.service=seguidor-api
      - traefik.http.services.seguidor-api.loadbalancer.server.port=80

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://api.seguidor.unbrabyte.com/api
    labels:
      - traefik.enable=true
      - traefik.http.routers.seguidor-web.rule=Host(`seguidor.unbrabyte.com`)
      - traefik.http.routers.seguidor-web.entryPoints=http
      - traefik.http.routers.seguidor-web.service=seguidor-web
      - traefik.http.services.seguidor-web.loadbalancer.server.port=80
